<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
    <title>Bản Đồ Sinh Thái - Động Vật</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000; 
            font-family: Arial, sans-serif; touch-action: none;
        }

        #global-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('bg-game.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(3px) brightness(0.85); 
            z-index: 1; 
        }

        .screen {
            display: none; position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; 
        }
        .screen.active { display: block; }

        .zoom-wrapper {
            width: 100%; height: 100%; position: relative;
            overflow: hidden; cursor: grab; background-color: transparent;
        }
        .zoom-wrapper:active { cursor: grabbing; }
        
        .zoom-content {
            position: absolute; transform-origin: 0 0;
            width: 100vw; min-width: 1200px; 
        }
        .zoom-content img { width: 100%; display: block; pointer-events: none; }

        /* THANH TÀI NGUYÊN (HIỂN THỊ TÊN & ĐĂNG XUẤT) */
        .resource-bar {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0, 0, 0, 0.7); color: gold;
            padding: 10px 15px; border-radius: 12px;
            font-size: 18px; font-weight: bold; z-index: 50;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid gold;
            display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
        }

        .game-title {
            position: absolute;
            top: 5px; 
            left: 50%;
            transform: translateX(-50%);
            width: 320px; 
            max-width: 60%; 
            z-index: 60; 
            pointer-events: none; 
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.6)); 
        }

        /* NÚT CHUYỂN VỀ GAME 1 BẰNG ẢNH (GÓC PHẢI DƯỚI) */
        .btn-switch-game-1 {
            position: absolute; 
            bottom: 15px; 
            right: 15px; 
            width: 75px; 
            height: 90px; 
            background: url('quaylaigame1.png') no-repeat center center;
            background-size: 100% 100%;
            background-color: transparent;
            border: 2px solid #ffcc00; 
            border-radius: 12px; 
            z-index: 50; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            transition: transform 0.2s, filter 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-switch-game-1:active { 
            transform: scale(0.9); 
            filter: brightness(1.2);
        }

        /* KHU VỰC NÚT QUẢNG CÁO */
        #ad-container {
            position: absolute;
            bottom: 15px;
            left: 15px;
            z-index: 50;
            display: flex;
            align-items: center; 
            gap: 10px; 
            max-width: calc(100% - 100px); 
        }
        #ad-btn {
            width: 130px; 
            height: auto;
            cursor: pointer;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
            transition: transform 0.2s, filter 0.3s;
        }
        #ad-btn:active { transform: scale(0.9); }
        #ad-btn.disabled {
            filter: grayscale(100%) opacity(0.6) drop-shadow(0 2px 5px rgba(0,0,0,0.5));
            cursor: not-allowed;
        }
        #ad-timer {
            background: rgba(20, 30, 20, 0.85);
            color: #aed581;
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-family: monospace;
            font-size: 16px;
            border: 2px solid #556B2F;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            white-space: nowrap;
        }

        .map-hotspot {
            position: absolute; border-radius: 50%;
            background-color: rgba(255, 215, 0, 0.4); 
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            animation: pulse 1.5s infinite; cursor: pointer; z-index: 20;
        }

        .anatomy-hotspot {
            position: absolute; cursor: pointer; z-index: 20;
            border-radius: 5px;
            background-color: transparent; 
            border: none; 
            transition: all 0.2s ease-in-out;
        }
        .anatomy-hotspot:hover, .anatomy-hotspot:active {
            background-color: rgba(255, 215, 0, 0.3); 
            border: 2px solid rgba(255, 215, 0, 0.9);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(255, 215, 0, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        #modal-overlay {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 9999;
            justify-content: center; align-items: center;
        }
        #modal-box {
            position: relative;
            width: 90%; max-width: 480px;
            aspect-ratio: 746 / 346; 
            background-image: url('khung.png'); 
            background-size: 100% 100%;
            background-color: transparent;
            background-repeat: no-repeat;
        }
        
        #modal-box h3 { 
            position: absolute; 
            top: 17%; left: 12%; width: 76%; height: 43%;
            display: flex; justify-content: center; align-items: center;
            color: #fcebc4; 
            font-size: 18px; line-height: 1.4; text-align: center;
            margin: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .btn-modal {
            position: absolute;
            top: 67%; height: 22%;
            background-color: transparent;
            border: none; outline: none; cursor: pointer;
            border-radius: 8px;
        }
        .btn-modal:active { background-color: rgba(255, 255, 255, 0.2); }
        
        #btn-yes { left: 18%; width: 31%; }
        #btn-no { left: 52.5%; width: 31%; }

        #screen-video.active, #screen-ad.active, #screen-detail.active {
            display: flex; flex-direction: column; background: rgba(0, 0, 0, 0.9); 
        }
        #video-wrapper, #ad-wrapper, #detail-wrapper {
            position: relative; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }
        video, #detail-image { width: 100%; height: 100%; object-fit: contain; }
        #detail-wrapper { height: 85%; }

        #custom-controls, #ad-time-display {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px; border-radius: 30px;
            display: flex; align-items: center; gap: 15px; color: white; z-index: 100;
            font-size: 16px; font-family: monospace; white-space: nowrap;
        }
        #volume-control { cursor: pointer; width: 100px; }

        #back-to-anatomy-btn {
            height: 15%; background: rgba(51, 51, 51, 0.9); color: white;
            border: none; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%;
            z-index: 50;
        }

        #next-quiz-btn {
            position: absolute; bottom: 20px; right: 20px; z-index: 50;
            background-color: #5c8a3f; color: white; border: 2px solid #aed581;
            padding: 15px 30px; font-size: 18px; font-weight: bold;
            border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: transform 0.2s, background-color 0.2s;
        }
        #next-quiz-btn:hover { background-color: #689f38; }
        #next-quiz-btn:active { transform: scale(0.95); }

        #screen-quiz.active, #screen-result.active {
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            background-color: rgba(20, 30, 20, 0.6); 
            color: white; padding: 20px; box-sizing: border-box;
            backdrop-filter: blur(4px);
        }

        .quiz-container {
            width: 95%; max-width: 750px; 
            min-height: 450px;
            background-image: url('khungcauhoi.png');
            background-size: 100% 100%; 
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            padding: 70px 50px 60px 50px; 
            text-align: center;
            box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: center;
            filter: drop-shadow(0 15px 40px rgba(0,0,0,0.7));
        }

        #quiz-progress { 
            font-size: 16px; color: #aed581; margin-bottom: 15px; 
            font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        
        #quiz-question { 
            font-size: 22px; margin-bottom: 35px; line-height: 1.6; 
            color: #ffeb3b; text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
            animation: fadeInDown 0.6s ease-out;
            font-weight: bold;
        }

        .quiz-options { display: flex; flex-direction: column; gap: 15px; }

        .quiz-option-btn {
            background: linear-gradient(to right, rgba(244, 232, 211, 0.95), rgba(230, 220, 200, 0.95));
            color: #1b3010; border: none;
            padding: 16px 20px; font-size: 17px; border-radius: 12px; font-weight: bold;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            text-align: left; border-left: 6px solid #7cb342;
            box-shadow: 0 5px 12px rgba(0,0,0,0.4);
            opacity: 0; animation: slideInRight 0.5s ease-out forwards;
            -webkit-tap-highlight-color: transparent; 
        }
        .quiz-option-btn:nth-child(1) { animation-delay: 0.1s; }
        .quiz-option-btn:nth-child(2) { animation-delay: 0.2s; }
        .quiz-option-btn:nth-child(3) { animation-delay: 0.3s; }
        .quiz-option-btn:nth-child(4) { animation-delay: 0.4s; }

        @media (hover: hover) {
            .quiz-option-btn:hover { 
                background: linear-gradient(to right, #7cb342, #558b2f); 
                color: white; border-left: 6px solid #ffeb3b;
                transform: translateX(12px) scale(1.02); 
                box-shadow: 0 8px 20px rgba(124, 179, 66, 0.5);
            }
        }

        .quiz-option-btn:active { 
            background: linear-gradient(to right, #7cb342, #558b2f); 
            color: white;
            transform: translateX(5px) scale(0.98); 
        }

        .result-board {
            position: relative;
            width: 95%; max-width: 500px; 
            aspect-ratio: 548 / 620; 
            background-image: url('khungthongbao.png'); 
            background-size: 100% 100%;
            background-color: transparent;
            background-repeat: no-repeat;
            filter: drop-shadow(0 15px 40px rgba(0,0,0,0.8));
            animation: popIn 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .result-circle-text {
            position: absolute;
            top: 29%; left: 33%; width: 34%; height: 22%;
            display: flex; justify-content: center; align-items: center;
            font-size: 34px; font-weight: bold; color: #558b2f;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.7);
        }

        .result-meat-text {
            position: absolute;
            top: 61%; left: 20%; width: 35%; height: 15%;
            display: flex; justify-content: flex-end; align-items: center;
            font-size: 32px; font-weight: bold; color: #e65100;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
            padding-right: 15px;
        }

        .btn-invisible {
            position: absolute;
            top: 80.5%; left: 18%; width: 64%; height: 10%;
            background-color: transparent;
            border: none; outline: none; cursor: pointer;
            border-radius: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-invisible:active {
            background-color: rgba(255, 255, 255, 0.2);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ===== CSS CHO MINIGAME CÁ HEO ===== */
        #screen-dolphin-game.active {
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            background: linear-gradient(to bottom, #0077be, #003b5e);
            position: relative;
        }

        .canvas-container {
            position: relative;
            width: 100%; max-width: 800px;
            aspect-ratio: 2 / 1; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 4px solid #4fc3f7;
            border-radius: 12px;
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.1);
        }

        #dolphin-canvas {
            width: 100%; height: 100%;
            display: block;
        }

        #dolphin-score-display {
            position: absolute; top: 15px; left: 15px;
            color: #fff; font-size: 22px; font-weight: bold;
            text-shadow: 2px 2px 4px #000; z-index: 10;
            font-family: monospace;
        }

        .dolphin-controls {
            position: absolute; bottom: 15px; right: 15px;
            display: flex; flex-direction: column; gap: 15px;
            z-index: 10;
        }

        .btn-move {
            width: 65px; height: 65px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.8); border: 3px solid #0077be;
            font-size: 28px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; user-select: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-move:active {
            background: rgba(200, 200, 200, 0.9); transform: scale(0.9);
        }
        /* =================================== */
    </style>
</head>

    <script>
        const NGROK_URL = 'https://ageless-moonscape-junkman.ngrok-free.dev';

        let currentUser = '';
        let currentPassword = '';
        let totalMeat = 0;
        let currentMaxWin = 0; 
        let currentAnimal = '';

        const adCooldown = 60 * 60 * 1000; 
        const adTimerEl = document.getElementById('ad-timer');
        const adBtnEl = document.getElementById('ad-btn');
        const adVideo = document.getElementById('ad-video');
        const adTimeDisplay = document.getElementById('ad-time-display');

        window.onload = async () => {

        function setupZoomPan(wrapperId, contentId) {
            const wrapper = document.getElementById(wrapperId);
            const content = document.getElementById(contentId);
            let scale = 1, posX = 0, posY = 0;
            let isDragging = false, startX, startY;
            let initialPinchDistance = null, initialScale = 1;

            function updateTransform() {
                content.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
            }

            wrapper.addEventListener('mousedown', (e) => {
                if(e.target.tagName.toLowerCase() === 'button' || e.target.tagName.toLowerCase() === 'img') return;
                isDragging = true;
                startX = e.clientX - posX; startY = e.clientY - posY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                posX = e.clientX - startX; posY = e.clientY - startY;
                updateTransform();
            });
            wrapper.addEventListener('wheel', (e) => {
                e.preventDefault();
                const xs = (e.clientX - posX) / scale, ys = (e.clientY - posY) / scale;
                scale *= (e.deltaY > 0 ? 0.9 : 1.1); 
                scale = Math.max(0.3, Math.min(scale, 4));
                posX = e.clientX - xs * scale; posY = e.clientY - ys * scale;
                updateTransform();
            }, {passive: false});

            function getPinchDistance(touches) {
                return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
            }

            wrapper.addEventListener('touchstart', (e) => {
                if(e.target.tagName.toLowerCase() === 'button' || e.target.tagName.toLowerCase() === 'img') return;
                if (e.touches.length === 1) {
                    isDragging = true;
                    startX = e.touches[0].clientX - posX; startY = e.touches[0].clientY - posY;
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    initialPinchDistance = getPinchDistance(e.touches);
                    initialScale = scale;
                }
            }, {passive: false});

            wrapper.addEventListener('touchmove', (e) => {
                if(e.target.tagName.toLowerCase() === 'button' || e.target.tagName.toLowerCase() === 'img') return;
                e.preventDefault(); 
                if (e.touches.length === 1 && isDragging) { 
                    posX = e.touches[0].clientX - startX; posY = e.touches[0].clientY - startY;
                    updateTransform();
                } else if (e.touches.length === 2 && initialPinchDistance) { 
                    const currentDistance = getPinchDistance(e.touches);
                    scale = initialScale * (currentDistance / initialPinchDistance);
                    scale = Math.max(0.3, Math.min(scale, 4));
                    updateTransform();
                }
            }, {passive: false});

            wrapper.addEventListener('touchend', (e) => {
                if (e.touches.length === 0) { isDragging = false; initialPinchDistance = null; }
                else if (e.touches.length === 1) {
                    startX = e.touches[0].clientX - posX; startY = e.touches[0].clientY - posY;
                    isDragging = true;
                }
            });

            return function resetView(offsetX) {
                posX = offsetX; scale = 1; posY = 0;
                updateTransform();
            }
        }

            }

                const btn = document.createElement('button');
                btn.className = 'quiz-option-btn';
                btn.textContent = opt;
                btn.onclick = () => {
                    document.activeElement.blur(); 
                    checkAnswer(index, currentQ.ans);
                };
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, correctIndex) {
            if (selectedIndex === correctIndex) correctAnswers++;
            currentQuestionIndex++;
            loadQuestion();
        }

        function endQuiz() {
            let multiplier = 0;
            if (correctAnswers >= 18) {
                multiplier = 45;
            } else if (correctAnswers >= 12) {
                multiplier = 35;
            } else if (correctAnswers >= 6) {
                multiplier = 30;
            } else if (correctAnswers >= 1) {
                multiplier = 20;
            }

            const meatEarned = correctAnswers * multiplier;
            totalMeat += meatEarned;

            if (currentAnimal === 'lion') {
                localStorage.setItem(`lionLastPlayedTime_${currentUser}`, Date.now().toString());
            }

            document.getElementById('correct-count-txt').style.color = "#558b2f";
            document.getElementById('correct-count-txt').textContent = correctAnswers + "/20";
            document.getElementById('meat-earned-txt').textContent = "+" + meatEarned + " 🥩";
            document.getElementById('meat-count').textContent = totalMeat;

            makeSecureTransaction(meatEarned, 'add_win', () => {
                switchScreen('screen-result');
            });
        }

        document.getElementById('return-map-btn').addEventListener('click', () => {
            switchScreen('screen-map');
            if (window.innerWidth < 800) resetMapView(-200);
        });

        // ==========================================
        // HỆ THỐNG MINIGAME CÁ HEO VƯỢT CHƯỚNG NGẠI VẬT
        // ==========================================
        const dCanvas = document.getElementById('dolphin-canvas');
        const dCtx = dCanvas.getContext('2d');
        let dAnimationId = null;
        let dGameFrame = 0;
        let dDistance = 0;
        let isDGameRunning = false;
        let spawnTimer = 0;

        let dolphinObj = { x: 80, y: 180, width: 60, height: 35, dy: 0, speed: 6 };
        let obstacles = [];

        const btnUp = document.getElementById('btn-up');
        const btnDown = document.getElementById('btn-down');

        function moveDolphinUp(e) { if(e) e.preventDefault(); dolphinObj.dy = -dolphinObj.speed; }
        function moveDolphinDown(e) { if(e) e.preventDefault(); dolphinObj.dy = dolphinObj.speed; }
        function stopDolphin(e) { if(e) e.preventDefault(); dolphinObj.dy = 0; }

        btnUp.addEventListener('touchstart', moveDolphinUp, {passive: false});
        btnUp.addEventListener('mousedown', moveDolphinUp);
        btnUp.addEventListener('touchend', stopDolphin);
        btnUp.addEventListener('mouseup', stopDolphin);
        btnUp.addEventListener('mouseleave', stopDolphin);

        btnDown.addEventListener('touchstart', moveDolphinDown, {passive: false});
        btnDown.addEventListener('mousedown', moveDolphinDown);
        btnDown.addEventListener('touchend', stopDolphin);
        btnDown.addEventListener('mouseup', stopDolphin);
        btnDown.addEventListener('mouseleave', stopDolphin);

        window.addEventListener('keydown', (e) => {
            if (!isDGameRunning) return;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') moveDolphinUp();
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') moveDolphinDown();
        });
        window.addEventListener('keyup', (e) => {
            if (!isDGameRunning) return;
            if (['ArrowUp', 'w', 'W', 'ArrowDown', 's', 'S'].includes(e.key)) stopDolphin();
        });

        function startDolphinGame() {
            switchScreen('screen-dolphin-game');
            dolphinObj.y = 180;
            dolphinObj.dy = 0;
            obstacles = [];
            dGameFrame = 0;
            dDistance = 0;
            spawnTimer = 0;
            isDGameRunning = true;
            document.getElementById('dolphin-score-display').textContent = `Quãng đường: 0m`;
            
            if (dAnimationId) cancelAnimationFrame(dAnimationId);
            dLoop(); 
        }

        function dLoop() {
            if (!isDGameRunning) return;
            
            dCtx.clearRect(0, 0, dCanvas.width, dCanvas.height);

            dolphinObj.y += dolphinObj.dy;
            if (dolphinObj.y < 0) dolphinObj.y = 0;
            if (dolphinObj.y + dolphinObj.height > dCanvas.height) dolphinObj.y = dCanvas.height - dolphinObj.height;

            dCtx.fillStyle = "#81d4fa";
            dCtx.beginPath();
            dCtx.roundRect(dolphinObj.x, dolphinObj.y, dolphinObj.width, dolphinObj.height, 10);
            dCtx.fill();
            dCtx.font = "26px Arial";
            dCtx.fillText("🐬", dolphinObj.x + 15, dolphinObj.y + 26);

            spawnTimer--;
            if (spawnTimer <= 0) {
                let obsHeight = Math.random() * 80 + 40;
                let obsY = Math.random() * (dCanvas.height - obsHeight);
                let obsSpeed = 7;
                
                if (dDistance > 100 && dDistance <= 500) {
                    obsSpeed = 8;
                } else if (dDistance > 500) {
                    obsSpeed = 10;
                }

                obstacles.push({
                    x: dCanvas.width, y: obsY, width: 45, height: obsHeight, speed: obsSpeed
                });

                if (dDistance <= 100) {
                    spawnTimer = 80;
                } else if (dDistance <= 500) {
                    spawnTimer = 45;
                } else {
                    spawnTimer = 25;
                    if (Math.random() < 0.4) {
                        obstacles.push({
                            x: dCanvas.width + 50, 
                            y: Math.random() * (dCanvas.height - obsHeight), 
                            width: 45, height: obsHeight, speed: obsSpeed + 1
                        });
                    }
                }
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= obs.speed; 
                
                dCtx.fillStyle = "#ff5252";
                dCtx.fillRect(obs.x, obs.y, obs.width, obs.height);
                dCtx.font = "24px Arial";
                dCtx.fillText("💣", obs.x + 5, obs.y + obs.height/2 + 8);

                if (dolphinObj.x + 5 < obs.x + obs.width &&
                    dolphinObj.x + dolphinObj.width - 5 > obs.x &&
                    dolphinObj.y + 5 < obs.y + obs.height &&
                    dolphinObj.height + dolphinObj.y - 5 > obs.y) {
                    
                    gameOverDolphin(false);
                    return; 
                }
            }

            obstacles = obstacles.filter(obs => obs.x + obs.width > 0);

            dGameFrame++;
            if (dGameFrame % 5 === 0) {
                dDistance++;
                document.getElementById('dolphin-score-display').textContent = `Quãng đường: ${dDistance}m`;
                
                let currentMeat = Math.floor(dDistance / 10) * 50;
                if (currentMeat >= 10000) {
                    gameOverDolphin(true);
                    return;
                }
            }

            dAnimationId = requestAnimationFrame(dLoop);
        }

        function gameOverDolphin(isMaxWin = false) {
            isDGameRunning = false;
            
            let meatEarned = Math.floor(dDistance / 10) * 50;
            if (meatEarned > 10000) meatEarned = 10000;
            totalMeat += meatEarned;

            localStorage.setItem(`dolphinLastPlayedTime_${currentUser}`, Date.now().toString());

            if (isMaxWin) {
                document.getElementById('correct-count-txt').textContent = "MAX!";
                document.getElementById('correct-count-txt').style.color = "#d50000";
            } else {
                document.getElementById('correct-count-txt').textContent = dDistance + " m";
                document.getElementById('correct-count-txt').style.color = "#558b2f";
            }
            
            document.getElementById('meat-earned-txt').textContent = "+" + meatEarned + " 🥩";
            document.getElementById('meat-count').textContent = totalMeat;

            makeSecureTransaction(meatEarned, 'add_win', () => {
                switchScreen('screen-result');
            });
        }

    </script>
</body>
</html>
